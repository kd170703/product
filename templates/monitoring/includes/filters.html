<form method="get" class="filter-panel" aria-label="Фильтры данных">{% if filters.section %}<input type="hidden" name="section" value="{{ filters.section }}">{% endif %}{% if filters.indicator %}<input type="hidden" name="indicator" value="{{ filters.indicator }}">{% endif %}<div class="filter-title"><span aria-hidden="true">≡</span> Выбор данных</div><div class="filter-fields"><label class="filter-field filter-search">Поиск<input type="search" name="q" value="{{ filters.q|default:'' }}" placeholder="Название показателя или вопрос"></label><label class="filter-field">Тематический раздел<select name="topic"><option value="">Все темы</option>{% for topic in topics %}<option value="{{ topic.slug }}" {% if filters.topic == topic.slug %}selected{% endif %}>{{ topic.name }}</option>{% endfor %}</select></label><label class="filter-field">Территория<input name="territory" value="{{ filters.territory|default:'' }}" placeholder="Все территории" list="territories"></label><label class="filter-field filter-date">Начало периода<input type="date" name="start" value="{{ filters.start|default:'' }}"></label><label class="filter-field filter-date">Конец периода<input type="date" name="end" value="{{ filters.end|default:'' }}"></label><button class="button button-primary filter-apply" type="submit">Применить</button>{% if has_filters %}<a class="text-button filter-reset" href="{{ request.path }}">Сбросить</a>{% endif %}</div>{% if territories %}<datalist id="territories">{% for territory in territories %}<option value="{{ territory }}">{% endfor %}</datalist>{% endif %}<p class="filter-hint">Тема объединяет связанные вопросы и показатели. Периоды выбираются по дате наблюдения.</p></form>
